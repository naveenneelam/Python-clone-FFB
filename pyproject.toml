[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyffb-studio"
version = "0.1.0"
description = "Clean-room Python force-feedback wheel manager with game profiles and OpenFFBoard support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyFFB contributors" }]
keywords = ["force-feedback", "sim-racing", "ffb", "openffboard", "hid", "directinput"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Simulation",
  "Topic :: System :: Hardware",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
process = ["psutil>=5.9"]
dev = ["pytest>=8", "psutil>=5.9"]
all = ["psutil>=5.9"]

[project.scripts]
pyffb = "pyffb.cli:main"

[project.gui-scripts]
pyffb-gui = "pyffb.cli:gui_entry"

[tool.setuptools.packages.find]
include = ["pyffb*"]

[tool.setuptools.package-data]
pyffb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
